<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm Albums</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" hidden>
    <img src="img/record.png" alt="" class="loading-record">
    <p id="loadingText"></p>
</div>

<nav class="navbar">
    <span onclick="location.reload()"><img src="img/newtypeicon.png" alt="Site Logo"></span>
        <div class="search-box">
        <div class="search-input-area">
            <input id="searchInput" type="text" placeholder="Search for an artist...">
            <div class="search-toggle" role="group" aria-label="Search by">
                <button id="artistToggle" class="active" type="button" aria-pressed="true">Artist</button>
                <button id="albumToggle" type="button" aria-pressed="false">Album</button>
            </div>
        </div>
        <button id="searchButton">Search</button>
    
    </div>
</nav>

<main>

    <p id="status"></p>
    <section class="music-carousel" id="recentRatingsSection">
        <h1>Recently Rated</h1>
        <div class="carousel-track" id="recentRatingsTrack"></div>
    </section>

    <!-- MY TOP ARTISTS -->
    <section class="music-carousel" id="topArtistsSection">
              <h1>Popular Artists</h1>
        <div class="carousel-track" id="carouselTrack"></div>
    </section>    <div id="artistInfo"></div>
              <h1> Popular Albums</h1>
    <div id="albumGrid"></div>
</main>

<footer class="footer">
    <div class="footer-content">
        <img src="img/newtypeicon.png" alt="Encore site icon">
        <div class="footer-copy">
            <span class="footer-logo">ENCORE</span>
            <p>Discover your next favourite album and rate the songs.</p>
        </div>
    </div>
    <div class="footer-bottom">
        <span>Powered by Last.fm</span>
    </div>
</footer>
<script src="script.js"></script>
</body>
</html>
